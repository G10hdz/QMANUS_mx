<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QMANUS_mx — arquitectura</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: 0.4rem;
    }
    .sub { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>QMANUS_mx — multi-tenant agent platform</h1>
    <p class="sub">Alibaba Cloud × TiDB Hackathon CDMX. Cada tenant tiene sesiones aisladas y analytics en tiempo real sobre TiDB HTAP.</p>

    <svg viewBox="0 0 1100 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="qm-title qm-desc">
      <title id="qm-title">QMANUS_mx: frontend a TiDB HTAP</title>
      <desc id="qm-desc">index.html es el dashboard; FastAPI maneja auth JWT por tenant, sesiones de agente y tool calls; TiDB Cloud guarda OLTP en agent_sessions y tool_calls con replicas TiFlash para analytics OLAP; Qwen via DashScope; Terraform provisiona Alibaba Cloud.</desc>
      <defs>
        <marker id="qm-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="qm-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1100" height="440" fill="#f5f5f5"/>

      <!-- frontend -->
      <rect x="60" y="140" width="220" height="110" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="170" y="170" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">index.html</text>
      <text x="170" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Analytics Dashboard</text>
      <text x="170" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ Agent UI · vanilla</text>
      <text x="170" y="230" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP + JWT</text>

      <!-- backend -->
      <rect x="350" y="100" width="300" height="190" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.35)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="500" y="124" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FASTAPI · PYTHON 3.12</text>
      <g font-family="'Geist Mono', monospace" font-size="9.5">
        <rect x="370" y="140" width="260" height="32" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="500" y="160" fill="#2d3142" text-anchor="middle">tenant auth — JWT HS256</text>
        <rect x="370" y="180" width="260" height="32" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="500" y="200" fill="#2d3142" text-anchor="middle">agent sessions · aisladas por tenant</text>
        <rect x="370" y="220" width="260" height="32" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="500" y="240" fill="#2d3142" text-anchor="middle">tool calls · history</text>
      </g>
      <text x="500" y="276" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">app/ routes · middleware · context · provision_tenant.py</text>

      <!-- qwen -->
      <rect x="720" y="60" width="330" height="56" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="885" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Qwen — DashScope API</text>
      <text x="885" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Alibaba AI</text>

      <!-- tidb -->
      <rect x="720" y="150" width="330" height="130" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="885" y="174" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TIDB CLOUD — HTAP (MYSQL-COMPAT)</text>
      <rect x="740" y="190" width="140" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="810" y="212" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OLTP</text>
      <text x="810" y="230" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">agent_sessions tool_calls</text>
      <rect x="890" y="190" width="140" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="960" y="212" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OLAP</text>
      <text x="960" y="230" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">TiFlash → analytics</text>

      <!-- terraform -->
      <rect x="720" y="300" width="330" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="885" y="322" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">terraform/ — Alibaba provider</text>
      <text x="885" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">main · variables · outputs</text>

      <!-- edges -->
      <path d="M 280 195 L 350 195" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#qm-arrow-accent)"/>
      <text x="303" y="186" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">JWT</text>
      <path d="M 650 140 L 720 95" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qm-arrow)"/>
      <path d="M 650 200 L 720 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qm-arrow)"/>
      <text x="670" y="192" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">aiomysql+SSL</text>
      <path d="M 880 220 L 890 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#qm-arrow)"/>

      <!-- footer -->
      <rect x="40" y="360" width="1020" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="550" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gen_tokens.py · db.py · TechDoc_MultiTenant_GameVault + pitch PDF en repo</text>
      <text x="550" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hackathon Mar 2026 · AgentNexus</text>
    </svg>
  </div>
</body>
</html>
